<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">ChengLan AI Music Studio</title>
  <desc id="desc">An orange and blue illustrated music workspace with a waveform, a song card and a creation timeline.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#12294a"/><stop offset=".58" stop-color="#263f6a"/><stop offset="1" stop-color="#50629b"/></linearGradient>
    <linearGradient id="warm" x2="1" y2="1"><stop stop-color="#f6b373"/><stop offset="1" stop-color="#e77748"/></linearGradient>
    <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#fefefe" stop-opacity=".22"/><stop offset="1" stop-color="#fefefe" stop-opacity=".08"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#f5a875" stop-opacity=".58"/><stop offset="1" stop-color="#f5a875" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#d9e6ff" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1200" height="430" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="430" rx="26" fill="url(#grid)"/>
  <circle cx="976" cy="43" r="340" fill="url(#glow)"/>
  <path d="M0 341C239 301 286 410 529 362S937 278 1200 374V430H0Z" fill="#081d3d" opacity=".45"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="65" y="57" width="190" height="30" rx="15" fill="#f3a56a" opacity=".17"/>
    <text x="82" y="77" font-size="13" font-weight="700" letter-spacing="1.7" fill="#ffbd86">APPLIED AI · MUSIC</text>
    <text x="64" y="155" font-size="54" font-weight="750" fill="#ffffff">ChengLan</text>
    <text x="64" y="215" font-size="54" font-weight="750" fill="#ffffff">Music Studio<tspan fill="#f9ad76">.</tspan></text>
    <text x="66" y="270" font-size="20" fill="#d0def3">Create, edit and organize music</text>
    <text x="66" y="300" font-size="20" fill="#d0def3">in one responsive workspace.</text>
    <text x="66" y="349" font-size="14" fill="#bad0ec">React · TypeScript · Fastify · SQLite · FFmpeg</text>
  </g>
  <g transform="translate(780 48)">
    <rect width="346" height="326" rx="24" fill="url(#glass)" stroke="#dce9ff" stroke-opacity=".26"/>
    <rect x="20" y="20" width="306" height="147" rx="15" fill="#172d52"/>
    <circle cx="173" cy="86" r="59" fill="#d78262" opacity=".26"/>
    <circle cx="173" cy="86" r="34" fill="#f6ad78" opacity=".35"/>
    <path d="M160 99V70l29-7v29M160 78l29-7" fill="none" stroke="#fff4e8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="155" cy="100" r="7" fill="#fff4e8"/><circle cx="184" cy="93" r="7" fill="#fff4e8"/>
    <text x="29" y="193" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="1.2" fill="#c5d7ef">NEON AFTER RAIN</text>
    <text x="29" y="226" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="650" fill="#ffffff">雨后霓虹</text>
    <rect x="29" y="255" width="288" height="38" rx="19" fill="#e8f0fd" opacity=".16"/>
    <circle cx="56" cy="274" r="13" fill="url(#warm)"/>
    <path d="m53 268 9 6-9 6z" fill="#173454"/>
    <g stroke="#bad1ee" stroke-width="3" stroke-linecap="round" opacity=".9">
      <path d="M91 270v8M101 264v20M111 267v14M121 260v28M131 269v10M141 264v20M151 271v6M161 262v24M171 266v16M181 269v10M191 261v26M201 270v8M211 266v16M221 261v26M231 269v10M241 264v20M251 270v8M261 266v16M271 262v24M281 269v10"/>
    </g>
  </g>
</svg>
